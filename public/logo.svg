<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" fill="none">
  <defs>
    <path id="circlePath" d="M 60,60 m -48,0 a 48,48 0 1,1 96,0 a 48,48 0 1,1 -96,0" />
  </defs>
  
  <!-- Logo mark: seal stamp -->
  <g id="seal">
    <!-- Outer ring -->
    <circle cx="60" cy="60" r="54" stroke="#2C2C2C" stroke-width="1.5" fill="none" />
    
    <!-- Inner ring -->
    <circle cx="60" cy="60" r="48" stroke="#2C2C2C" stroke-width="1" fill="none" />
    
    <!-- Circular text -->
    <text font-family="sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.8" fill="#2C2C2C">
      <textPath href="#circlePath" startOffset="0%" text-anchor="start">
        VERIDOCA · OBEROENDE GUIDER ·
      </textPath>
    </text>
    
    <!-- Center serif V -->
    <text x="60" y="78" font-family="serif" font-size="58" font-weight="600" fill="#C95D3F" text-anchor="middle" dominant-baseline="middle">
      V
    </text>
  </g>
  
  <!-- Wordmark "Veridoca" -->
  <text x="145" y="65" font-family="serif" font-size="52" font-weight="600" fill="#2C2C2C" letter-spacing="-0.5">
    Veridoca
  </text>
  
  <!-- Thin terracotta accent rule -->
  <line x1="145" y1="85" x2="365" y2="85" stroke="#C95D3F" stroke-width="1.5" />
</svg>
